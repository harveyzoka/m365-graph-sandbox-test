name: Weekly GitHub & M365 Activity Summary

on:
  schedule:
    # Chạy định kỳ vào 08:00 sáng Thứ Hai hằng tuần theo giờ Việt Nam (01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chế độ DEMO / Kiểm thử (chỉ hiển thị bản xem trước, không ghi vào logs/weekly-summary.md)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: weekly-activity-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-weekly-summary:
    name: Generate Sanitized Weekly Activity Summary
    # Chỉ chạy trên nhánh mặc định đáng tin cậy (main), không bao giờ chạy trên PR hoặc do bot kích hoạt
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'pull_request_target' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      TZ: Asia/Ho_Chi_Minh
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate sanitized weekly summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            python3 scripts/generate_weekly_summary.py --dry-run
          else
            python3 scripts/generate_weekly_summary.py --output logs/weekly-summary.md
          fi

      - name: Verify output contains no sensitive patterns
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [[ ! -f "logs/weekly-summary.md" ]]; then
            echo "::error::Không tìm thấy file logs/weekly-summary.md."
            exit 1
          fi
          if grep -Eqi '(eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}|tempauth=|Bearer[[:space:]]+[A-Za-z0-9._~+/-]{12,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|\.onmicrosoft\.com)' logs/weekly-summary.md; then
            echo "::error::Phát hiện dữ liệu định danh hoặc nhạy cảm trong logs/weekly-summary.md. Đã hủy bước commit."
            exit 1
          fi

      - name: Commit and push if summary changed
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            echo "Chế độ DEMO (dry_run=true): Bỏ qua bước commit và push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logs/weekly-summary.md
          if git diff --cached --quiet -- logs/weekly-summary.md; then
            echo "Không có thay đổi thực tế về số liệu trong tuần này; bỏ qua commit để tránh trùng lặp."
            exit 0
          fi

          WEEK_ID="$(TZ=Asia/Ho_Chi_Minh date '+%G-W%V')"
          COMMIT_MSG="chore(summary): update weekly activity summary (${WEEK_ID}) [skip ci]"
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          SUMMARY_B64="$(base64 -w 0 logs/weekly-summary.md)"

          git commit -m "${COMMIT_MSG}"
          git pull --rebase origin "${TARGET_BRANCH}" || true

          # Helper function: Update file on a branch via GitHub REST Contents API
          put_file_via_api() {
            local branch_name="$1"
            local existing_sha=""
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/logs/weekly-summary.md?ref=${branch_name}" --jq '.sha' 2>/dev/null || true)"
            local payload_file
            payload_file="$(mktemp)"
            if [[ -n "${existing_sha}" ]]; then
              jq -n \
                --arg msg "${COMMIT_MSG}" \
                --arg content "${SUMMARY_B64}" \
                --arg branch "${branch_name}" \
                --arg sha "${existing_sha}" \
                '{message: $msg, content: $content, branch: $branch, sha: $sha, committer: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com"}}' > "${payload_file}"
            else
              jq -n \
                --arg msg "${COMMIT_MSG}" \
                --arg content "${SUMMARY_B64}" \
                --arg branch "${branch_name}" \
                '{message: $msg, content: $content, branch: $branch, committer: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com"}}' > "${payload_file}"
            fi
            local rc=0
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/logs/weekly-summary.md" --input "${payload_file}" >/dev/null 2>&1 || rc=$?
            rm -f "${payload_file}"
            return "${rc}"
          }

          # 1. Thử push trực tiếp vào nhánh chính (main) với tối đa 2 lần thử
          MAIN_PUSH_OK="false"
          PUSH_ERR_LOG="$(mktemp)"
          for attempt in 1 2; do
            if git push origin "HEAD:${TARGET_BRANCH}" 2>"${PUSH_ERR_LOG}"; then
              MAIN_PUSH_OK="true"
              echo "Đã cập nhật trực tiếp logs/weekly-summary.md trên nhánh '${TARGET_BRANCH}' (git push)."
              break
            fi
            sleep 2
          done

          # 2. Nếu git push bị lỗi (vd: remote: fatal error in commit_refs), thử qua GitHub REST Contents API trên main
          if [[ "${MAIN_PUSH_OK}" != "true" ]]; then
            echo "::notice::git push trực tiếp vào '${TARGET_BRANCH}' không thành công ($(tr '\n' ' ' < "${PUSH_ERR_LOG}")). Đang thử cập nhật qua GitHub Contents API..."
            if put_file_via_api "${TARGET_BRANCH}"; then
              MAIN_PUSH_OK="true"
              echo "Đã cập nhật trực tiếp logs/weekly-summary.md trên nhánh '${TARGET_BRANCH}' (GitHub Contents API)."
            fi
          fi

          if [[ "${MAIN_PUSH_OK}" == "true" ]]; then
            rm -f "${PUSH_ERR_LOG}"
            exit 0
          fi

          # 3. Nếu nhánh main được bảo vệ, chuyển sang nhánh báo cáo và tạo/cập nhật Pull Request
          FALLBACK_BRANCH="summary/weekly-${WEEK_ID}"
          echo "::warning::Không thể ghi trực tiếp vào nhánh '${TARGET_BRANCH}'. Đang chuyển sang nhánh báo cáo '${FALLBACK_BRANCH}' và tạo Pull Request..."

          BRANCH_PUSH_OK="false"
          FALLBACK_ERR_LOG="$(mktemp)"
          if git push --force origin "HEAD:refs/heads/${FALLBACK_BRANCH}" 2>"${FALLBACK_ERR_LOG}"; then
            BRANCH_PUSH_OK="true"
          else
            BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha' 2>/dev/null || git rev-parse origin/"${TARGET_BRANCH}")"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${FALLBACK_BRANCH}" \
              -f sha="${BASE_SHA}" >/dev/null 2>&1 || true
            if put_file_via_api "${FALLBACK_BRANCH}"; then
              BRANCH_PUSH_OK="true"
            fi
          fi

          if [[ "${BRANCH_PUSH_OK}" == "true" ]]; then
            EXISTING_PR="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${FALLBACK_BRANCH}" --base "${TARGET_BRANCH}" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
            if [[ -n "${EXISTING_PR}" ]]; then
              echo "::notice::Đã cập nhật nhánh báo cáo '${FALLBACK_BRANCH}'. Pull Request hiện có: ${EXISTING_PR}"
            else
              PR_URL="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
                --base "${TARGET_BRANCH}" \
                --head "${FALLBACK_BRANCH}" \
                --title "chore(summary): update weekly activity summary (${WEEK_ID})" \
                --body "Báo cáo tổng hợp hoạt động tự động cho tuần **${WEEK_ID}** (đã lọc bỏ hoàn toàn thông tin định danh và nhạy cảm)." 2>/dev/null || true)"
              if [[ -n "${PR_URL}" ]]; then
                echo "::notice::Đã tạo Pull Request tự động cho báo cáo tuần ${WEEK_ID}: ${PR_URL}"
              else
                echo "::warning::Đã đẩy nhánh '${FALLBACK_BRANCH}' thành công nhưng chưa thể tạo Pull Request tự động. Hãy bật 'Allow GitHub Actions to create and approve pull requests' trong Settings -> Actions -> General."
              fi
            fi
            rm -f "${PUSH_ERR_LOG}" "${FALLBACK_ERR_LOG}"
            exit 0
          fi

          # 4. Nếu cả push vào main và tạo nhánh phụ đều bị từ chối, báo lỗi chi tiết và hướng dẫn cấu hình
          MAIN_ERR="$(tr '\n' ' ' < "${PUSH_ERR_LOG}")"
          BRANCH_ERR="$(tr '\n' ' ' < "${FALLBACK_ERR_LOG}")"
          rm -f "${PUSH_ERR_LOG}" "${FALLBACK_ERR_LOG}"

          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"

          ---
          ### ⚠️ Không thể ghi báo cáo vào Repository (Cần kiểm tra cài đặt)

          - **Lỗi khi ghi vào \`${TARGET_BRANCH}\`:** \`${MAIN_ERR}\`
          - **Lỗi khi tạo nhánh \`${FALLBACK_BRANCH}\`:** \`${BRANCH_ERR}\`

          #### Hướng dẫn khắc phục chính xác:
          1. Vào **Settings** → **Actions** → **General** → mục **Workflow permissions**:
             - Chọn **Read and write permissions** (hiện tại mặc định của repository đang là \`read\`).
             - Tích chọn **Allow GitHub Actions to create and approve pull requests** (nếu dùng chế độ tạo PR).
             - Nhấn **Save**.
          2. Nếu lỗi là \`remote: fatal error in commit_refs\`, đây là lỗi ghi ref phía máy chủ Git của GitHub hoặc quyền ghi của \`GITHUB_TOKEN\` bị hạn chế bởi cài đặt **Workflow permissions**. Sau khi bật **Read and write permissions**, bấm **Re-run failed jobs**.
          EOF

          echo "::error::Không thể ghi logs/weekly-summary.md vào '${TARGET_BRANCH}' (${MAIN_ERR}) hoặc tạo nhánh '${FALLBACK_BRANCH}' (${BRANCH_ERR}). Vui lòng kiểm tra Settings -> Actions -> General -> Workflow permissions -> chọn 'Read and write permissions'."
          exit 1
