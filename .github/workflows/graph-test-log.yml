name: Microsoft Graph Test Log

on:
  workflow_dispatch:
    inputs:
      feature:
        description: 'Tên tính năng kiểm thử (vd: Graph Batch + OneDrive + Metadata)'
        required: true
        type: string
        default: 'Weekly Graph Sandbox Check'
      batch:
        description: 'Kết quả Graph Batch ($batch) - Chỉ chọn PASS khi đã kiểm thử thực tế thành công'
        required: true
        type: choice
        options:
          - NOT_RUN
          - PASS
          - FAIL
        default: NOT_RUN
      file_write:
        description: 'Kết quả OneDrive PUT (Graph API Test) - Chỉ chọn PASS khi đã kiểm thử thực tế thành công'
        required: true
        type: choice
        options:
          - NOT_RUN
          - PASS
          - FAIL
        default: NOT_RUN
      metadata:
        description: 'Kết quả Metadata GET - Chỉ chọn PASS khi đã kiểm thử thực tế thành công'
        required: true
        type: choice
        options:
          - NOT_RUN
          - PASS
          - FAIL
        default: NOT_RUN
      notes:
        description: 'Ghi chú kết quả hoặc lỗi (KHÔNG nhập token, secret hoặc dữ liệu nhạy cảm)'
        required: false
        type: string
        default: 'Manual verification via Microsoft Graph Explorer'
      dry_run:
        description: 'Chế độ DEMO / Kiểm thử workflow (chỉ hiển thị preview, không ghi vào test-log.md)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graph-test-log-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record-test-log:
    name: Record Manual Graph Test Result
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh
      INPUT_FEATURE: ${{ inputs.feature }}
      INPUT_BATCH: ${{ inputs.batch }}
      INPUT_FILE_WRITE: ${{ inputs.file_write }}
      INPUT_METADATA: ${{ inputs.metadata }}
      INPUT_NOTES: ${{ inputs.notes }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate inputs and security constraints
        run: |
          set -euo pipefail

          # 1. Trim and check feature name
          FEATURE_TRIMMED="$(printf '%s' "${INPUT_FEATURE}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${FEATURE_TRIMMED}" ]]; then
            echo "::error::Trường 'feature' không được để trống."
            exit 1
          fi

          # 2. Validate allowed status values
          for status_var in INPUT_BATCH INPUT_FILE_WRITE INPUT_METADATA; do
            val="${!status_var}"
            if [[ "${val}" != "PASS" && "${val}" != "FAIL" && "${val}" != "NOT_RUN" ]]; then
              echo "::error::Giá trị không hợp lệ cho ${status_var}: '${val}'. Chỉ chấp nhận PASS, FAIL hoặc NOT_RUN."
              exit 1
            fi
          done

          # 3. When dry_run=false, require at least one real test (PASS or FAIL); allow all NOT_RUN when dry_run=true
          if [[ "${INPUT_BATCH}" == "NOT_RUN" && "${INPUT_FILE_WRITE}" == "NOT_RUN" && "${INPUT_METADATA}" == "NOT_RUN" ]]; then
            if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
              echo "::notice::Chế độ DEMO (dry_run=true): Cho phép tất cả bài kiểm thử là NOT_RUN để kiểm tra workflow và hiển thị bản preview."
            else
              echo "::error::Từ chối ghi log: Khi dry_run=false, cần ít nhất một bài kiểm thử thật có trạng thái PASS hoặc FAIL (hiện tại batch, file_write, metadata đều là NOT_RUN)."
              exit 1
            fi
          fi

          # 4. Guard against accidental inclusion of tokens/secrets/PII/IDs in public repository
          COMBINED_TEXT="${INPUT_FEATURE} ${INPUT_NOTES}"
          if printf '%s' "${COMBINED_TEXT}" | grep -Eqi '(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|tempauth=|Bearer[[:space:]]+[A-Za-z0-9._~+/-]+=*|client_secret|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|\.onmicrosoft\.com)'; then
            echo "::error::Phát hiện dữ liệu nhạy cảm hoặc định danh (Token, Secret, Email, Tenant/User/File UUID, hoặc domain .onmicrosoft.com). Repository đang ở chế độ PUBLIC, vui lòng loại bỏ trước khi ghi log."
            exit 1
          fi

          # 5. Validate existing batch JSON file remains intact
          if [[ -f "graph-batch-e5-renew.json" ]]; then
            jq empty graph-batch-e5-renew.json
          fi

      - name: Append test log entry
        run: |
          set -euo pipefail

          TIMESTAMP="$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M')"
          FEATURE_CLEAN="$(printf '%s' "${INPUT_FEATURE}" | tr '\r\n' '  ' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          NOTES_CLEAN="$(printf '%s' "${INPUT_NOTES:-No additional notes}" | tr '\r\n' '  ' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "${NOTES_CLEAN}" ]]; then
            NOTES_CLEAN="No additional notes"
          fi

          ENTRY_FILE="$(mktemp)"
          cat <<EOF > "${ENTRY_FILE}"

          ---

          **Date:** ${TIMESTAMP} (Asia/Ho_Chi_Minh)

          **Project:** Zoka Graph Test App

          **Feature:** ${FEATURE_CLEAN}

          **Test Results:**
          - Graph Batch: ${INPUT_BATCH}
          - OneDrive PUT: ${INPUT_FILE_WRITE}
          - Metadata GET: ${INPUT_METADATA}

          **Notes:** ${NOTES_CLEAN}

          **Execution:** Manual verification recorded via GitHub Actions
          EOF
          # Remove leading indentation from heredoc
          sed -i 's/^          //' "${ENTRY_FILE}"

          echo "### Bản xem trước mục nhật ký (Log Entry Preview)" >> "${GITHUB_STEP_SUMMARY}"
          cat "${ENTRY_FILE}" >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo '> **Chế độ DEMO (`dry_run: true`)**: Đã xác minh định dạng nhật ký. Không ghi vào `test-log.md` thực tế.' >> "${GITHUB_STEP_SUMMARY}"
            echo "Chế độ DEMO (dry_run=true): Chỉ hiển thị bản xem trước, không sửa đổi test-log.md."
            cat "${ENTRY_FILE}"
            rm -f "${ENTRY_FILE}"
            exit 0
          fi

          if [[ ! -f "test-log.md" || ! -s "test-log.md" ]]; then
            cat <<'HEADER' > test-log.md
          # Microsoft Graph Test Log

          Nhật ký kiểm thử thủ công Microsoft Graph API được ghi nhận qua GitHub Actions (`graph-test-log.yml`).
          HEADER
            sed -i 's/^          //' test-log.md
          fi

          cat "${ENTRY_FILE}" >> test-log.md
          rm -f "${ENTRY_FILE}"

      - name: Commit and push test-log.md
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            echo "Chế độ DEMO (dry_run=true): Tuyệt đối không ghi test-log.md hoặc tạo commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- test-log.md; then
            echo "Không có thay đổi nào trong test-log.md."
            exit 0
          fi

          TIMESTAMP="$(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M')"
          COMMIT_MSG="docs(log): record Graph API test result (${TIMESTAMP})"
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          LOG_B64="$(base64 -w 0 test-log.md)"

          git add test-log.md
          git commit -m "${COMMIT_MSG}"
          git pull --rebase origin "${TARGET_BRANCH}" || true

          put_log_via_api() {
            local branch_name="$1"
            local existing_sha=""
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/test-log.md?ref=${branch_name}" --jq '.sha' 2>/dev/null || true)"
            local payload_file
            payload_file="$(mktemp)"
            if [[ -n "${existing_sha}" ]]; then
              jq -n \
                --arg msg "${COMMIT_MSG}" \
                --arg content "${LOG_B64}" \
                --arg branch "${branch_name}" \
                --arg sha "${existing_sha}" \
                '{message: $msg, content: $content, branch: $branch, sha: $sha, committer: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com"}}' > "${payload_file}"
            else
              jq -n \
                --arg msg "${COMMIT_MSG}" \
                --arg content "${LOG_B64}" \
                --arg branch "${branch_name}" \
                '{message: $msg, content: $content, branch: $branch, committer: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com"}}' > "${payload_file}"
            fi
            local rc=0
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/test-log.md" --input "${payload_file}" >/dev/null 2>&1 || rc=$?
            rm -f "${payload_file}"
            return "${rc}"
          }

          MAIN_PUSH_OK="false"
          PUSH_ERR_LOG="$(mktemp)"
          for attempt in 1 2; do
            if git push origin "HEAD:${TARGET_BRANCH}" 2>"${PUSH_ERR_LOG}"; then
              MAIN_PUSH_OK="true"
              echo "Đã commit và push thành công vào nhánh ${TARGET_BRANCH} (git push)."
              break
            fi
            sleep 2
          done

          if [[ "${MAIN_PUSH_OK}" != "true" ]]; then
            echo "::notice::git push trực tiếp vào '${TARGET_BRANCH}' không thành công ($(tr '\n' ' ' < "${PUSH_ERR_LOG}")). Đang thử cập nhật qua GitHub Contents API..."
            if put_log_via_api "${TARGET_BRANCH}"; then
              MAIN_PUSH_OK="true"
              echo "Đã cập nhật trực tiếp test-log.md trên nhánh '${TARGET_BRANCH}' (GitHub Contents API)."
            fi
          fi

          if [[ "${MAIN_PUSH_OK}" == "true" ]]; then
            rm -f "${PUSH_ERR_LOG}"
            exit 0
          fi

          echo "::warning::Không thể push trực tiếp vào nhánh '${TARGET_BRANCH}'. Đang chuyển sang tạo nhánh phụ và Pull Request..."
          FALLBACK_BRANCH="log/graph-test-$(TZ=Asia/Ho_Chi_Minh date '+%Y%m%d-%H%M%S')"
          FALLBACK_ERR_LOG="$(mktemp)"
          BRANCH_PUSH_OK="false"
          if git push origin "HEAD:refs/heads/${FALLBACK_BRANCH}" 2>"${FALLBACK_ERR_LOG}"; then
            BRANCH_PUSH_OK="true"
          else
            BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha' 2>/dev/null || git rev-parse origin/"${TARGET_BRANCH}")"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${FALLBACK_BRANCH}" \
              -f sha="${BASE_SHA}" >/dev/null 2>&1 || true
            if put_log_via_api "${FALLBACK_BRANCH}"; then
              BRANCH_PUSH_OK="true"
            fi
          fi

          if [[ "${BRANCH_PUSH_OK}" == "true" ]]; then
            PR_URL="$(gh pr create --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" \
              --head "${FALLBACK_BRANCH}" \
              --title "${COMMIT_MSG}" \
              --body "Ghi nhận kết quả kiểm thử thủ công Microsoft Graph API vào \`test-log.md\`." 2>/dev/null || true)"
            if [[ -n "${PR_URL}" ]]; then
              echo "::notice::Đã đẩy log lên nhánh '${FALLBACK_BRANCH}' và tạo Pull Request: ${PR_URL}"
            else
              echo "::notice::Đã đẩy log lên nhánh '${FALLBACK_BRANCH}'. Hãy tạo Pull Request vào '${TARGET_BRANCH}'."
            fi
            rm -f "${PUSH_ERR_LOG}" "${FALLBACK_ERR_LOG}"
            exit 0
          fi

          MAIN_ERR="$(tr '\n' ' ' < "${PUSH_ERR_LOG}")"
          BRANCH_ERR="$(tr '\n' ' ' < "${FALLBACK_ERR_LOG}")"
          rm -f "${PUSH_ERR_LOG}" "${FALLBACK_ERR_LOG}"
          echo "::error::Không thể ghi test-log.md vào '${TARGET_BRANCH}' (${MAIN_ERR}) hoặc tạo nhánh '${FALLBACK_BRANCH}' (${BRANCH_ERR}). Vui lòng kiểm tra Settings -> Actions -> General -> Workflow permissions -> chọn 'Read and write permissions'."
          exit 1
